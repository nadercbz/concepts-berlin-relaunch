<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Concepts Media Intern</title>
<link rel="icon" href="../assets/logo/favicon.png">
<style>
@font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("../assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #0a0a0a; --card: #141414; --card2: #1b1b1b; --line: rgba(255,255,255,.12); --text: #fff; --muted: rgba(255,255,255,.6);
  --red: #a91b18; --red-l: #e4584f; --paper: #f3f2ef; --ease: cubic-bezier(.2,.7,.1,1);
  --pad: clamp(16px, 4vw, 48px); --sans: "Geist", "Helvetica Neue", Arial, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
img, video { display: block; max-width: 100%; }
[hidden] { display: none !important; }
::selection { background: var(--red); color: #fff; }

/* ---------- Anmeldung ---------- */
.gate { min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; position: relative; overflow: hidden; }
.gate::before { content: ""; position: absolute; inset: -20%; background: radial-gradient(40% 40% at 70% 20%, rgba(169,27,24,.35), transparent 70%), radial-gradient(35% 35% at 20% 90%, rgba(169,27,24,.18), transparent 70%); filter: blur(10px); animation: glow 14s ease-in-out infinite alternate; }
@keyframes glow { to { transform: translate3d(-4%, 3%, 0) scale(1.08); } }
.gate__box { position: relative; width: 100%; max-width: 400px; background: rgba(20,20,20,.82); border: 1px solid var(--line); border-radius: 18px; padding: 34px 28px 28px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 30px 80px rgba(0,0,0,.5); animation: rise .7s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
.gate__logo { height: 30px; width: auto; margin-bottom: 26px; }
.gate h1 { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; margin: 0 0 6px; }
.gate p { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
.fld { display: block; margin-bottom: 14px; }
.fld span { display: block; font-size: 12px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.fld input { width: 100%; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: #0d0d0d; padding: 0 14px; font-size: 16px; outline: none; transition: border-color .2s; }
.fld input:focus { border-color: var(--red-l); }
.chk { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); margin: 4px 0 20px; cursor: pointer; user-select: none; }
.chk input { width: 18px; height: 18px; accent-color: var(--red); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 10px; background: var(--red); color: #fff; font-weight: 600; transition: background .2s, transform .2s; }
.btn:hover { background: #c22420; }
.btn:active { transform: scale(.98); }
.btn--full { width: 100%; }
.btn[disabled] { opacity: .6; cursor: wait; }
.gate__err { min-height: 22px; margin-top: 12px; color: var(--red-l); font-size: 14px; text-align: center; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

/* ---------- App ---------- */
.top { position: sticky; top: 0; z-index: 20; background: rgba(10,10,10,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top__bar { max-width: 1440px; margin: 0 auto; padding: 0 var(--pad); height: 68px; display: flex; align-items: center; gap: 18px; }
.top__logo { height: 24px; width: auto; }
.top__tag { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: rgba(169,27,24,.18); color: var(--red-l); }
.tabs { display: flex; gap: 4px; margin-left: auto; background: #151515; border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tab { height: 36px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--muted); transition: color .2s, background .25s; }
.tab.is-on { background: #fff; color: #0a0a0a; }
.out { font-size: 14px; color: var(--muted); padding: 8px 4px; }
.out:hover { color: #fff; }
.main { max-width: 1440px; margin: 0 auto; padding: 0 var(--pad) 80px; }
.hero { padding: clamp(36px, 7vw, 84px) 0 clamp(24px, 4vw, 44px); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--red-l); margin-bottom: 12px; }
.hero h1 { font-size: clamp(36px, 7vw, 84px); line-height: .98; letter-spacing: -.03em; font-weight: 750; margin: 0; text-transform: uppercase; }
.hero p { color: var(--muted); max-width: 620px; margin: 16px 0 0; font-size: clamp(15px, 1.4vw, 18px); }
.view { animation: fadeIn .5s var(--ease) both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }

/* Preise */
.prices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; min-width: 0; }
.price { position: relative; display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 20px 14px 14px; overflow: hidden; transition: border-color .25s, transform .35s var(--ease), background .25s; opacity: 0; transform: translateY(14px); animation: workIn .6s var(--ease) forwards; }
.price:hover { border-color: rgba(228,88,79,.55); background: var(--card2); }
.price__img { width: 96px; height: 72px; border-radius: 10px; background: #222 center/cover no-repeat; transition: transform .5s var(--ease); }
.price:hover .price__img { transform: scale(1.04); }
.price__name { font-weight: 700; font-size: 18px; line-height: 1.2; }
.price__text { color: var(--muted); font-size: 14px; margin-top: 3px; }
.price__more { margin-top: 6px; font-size: 13px; color: var(--red-l); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.price__more:hover { text-decoration: underline; }
.price__val { font-family: var(--mono); font-size: clamp(19px, 2vw, 26px); font-weight: 600; white-space: nowrap; text-align: right; }
.price__val small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: .06em; text-transform: uppercase; }
.price__val--ask { font-size: 16px; color: var(--red-l); }
.price__ek { display: block; margin-top: 4px; font-size: 13px; font-weight: 400; color: var(--muted); }
.note { margin-top: 20px; color: var(--muted); font-size: 13px; }

/* Showroom */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 20px; position: sticky; top: 68px; z-index: 10; background: linear-gradient(var(--bg) 78%, transparent); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; transition: all .2s; }
.chip b { font-family: var(--mono); font-weight: 500; font-size: 12px; opacity: .7; }
.chip:hover { color: #fff; border-color: rgba(255,255,255,.35); }
.chip.is-on { background: var(--red); border-color: var(--red); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.work { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; background: var(--card); text-align: left; isolation: isolate; opacity: 0; transform: translateY(16px) scale(.98); animation: workIn .6s var(--ease) forwards; }
@keyframes workIn { to { opacity: 1; transform: none; } }
.work__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s, transform .8s var(--ease); }
.work__img.is-in { opacity: 1; }
.work--hell { background: var(--paper); }
.work--hell .work__img { object-fit: contain; padding: 8%; }
.work:hover .work__img { transform: scale(1.05); }
.work::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.82)); z-index: 1; }
.work__meta { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 2; }
.work__kunde { font-weight: 700; font-size: 19px; line-height: 1.2; }
.work__titel { font-size: 14px; color: rgba(255,255,255,.75); }
.work__tag { position: absolute; top: 12px; left: 12px; z-index: 2; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; background: rgba(10,10,10,.7); backdrop-filter: blur(8px); padding: 5px 9px; border-radius: 6px; }
.work__count { position: absolute; top: 12px; right: 12px; z-index: 2; font-family: var(--mono); font-size: 11px; background: rgba(10,10,10,.7); backdrop-filter: blur(8px); padding: 5px 9px; border-radius: 6px; display: flex; gap: 6px; align-items: center; }
.play { position: absolute; z-index: 2; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; background: rgba(169,27,24,.92); display: grid; place-items: center; transition: transform .3s var(--ease); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.play::before { content: ""; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
.work:hover .play { transform: scale(1.1); }
.skel { position: absolute; inset: 0; background: linear-gradient(100deg, #151515 30%, #1e1e1e 50%, #151515 70%); background-size: 300% 100%; animation: skel 1.4s linear infinite; }
@keyframes skel { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(5,5,5,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; grid-template-rows: auto 1fr auto; animation: fadeIn .3s ease both; }
.lb__top { display: flex; align-items: center; gap: 14px; padding: 14px var(--pad); }
.lb__title { font-weight: 700; font-size: 17px; line-height: 1.2; min-width: 0; }
.lb__title span { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
.lb__link { margin-left: auto; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.lb__link:hover { border-color: #fff; }
.lb__x { width: 40px; height: 40px; border-radius: 50%; background: #1b1b1b; font-size: 22px; line-height: 1; flex: 0 0 auto; }
.lb__x:hover { background: var(--red); }
.lb__stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 0 var(--pad); }
.lb__stage img, .lb__stage video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; animation: fadeIn .35s ease both; }
.lb__stage.is-hell img { background: var(--paper); padding: 3%; }
.lb__nav { position: absolute; top: 50%; width: 48px; height: 48px; margin-top: -24px; border-radius: 50%; background: rgba(30,30,30,.85); font-size: 22px; z-index: 2; }
.lb__nav:hover { background: var(--red); }
.lb__prev { left: 12px; } .lb__next { right: 12px; }
.lb__load { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--red-l); animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.lb__thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 14px var(--pad) calc(14px + env(safe-area-inset-bottom)); scrollbar-width: none; justify-content: center; }
.lb__thumbs::-webkit-scrollbar { display: none; }
.lb__th { flex: 0 0 auto; width: 64px; height: 48px; border-radius: 6px; overflow: hidden; opacity: .45; border: 2px solid transparent; background: #1b1b1b; transition: opacity .2s; }
.lb__th img { width: 100%; height: 100%; object-fit: cover; }
.lb__th.is-on { opacity: 1; border-color: var(--red-l); }

@media (max-width: 900px) {
  .prices { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .top__bar { height: 60px; gap: 10px; }
  .top__tag, .out__t { display: none; }
  .top__logo { height: 20px; }
  .tab { padding: 0 13px; font-size: 14px; height: 34px; }
  .chips { top: 60px; }
  .price { grid-template-columns: 64px 1fr; padding: 12px; gap: 12px; }
  .price__img { width: 64px; height: 64px; }
  .price__val { grid-column: 2; text-align: left; font-size: 20px; }
  .price__val small { display: block; margin: 0 0 2px; }
  .price__ek { display: block; margin: 2px 0 0; }
  .price > div { min-width: 0; }
  .price__val { white-space: normal; }
  .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .work { border-radius: 12px; aspect-ratio: 3 / 4; }
  .work__kunde { font-size: 15px; }
  .work__titel { font-size: 12px; }
  .work__meta { left: 10px; right: 10px; bottom: 10px; }
  .work__tag { display: none; }
  .play { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  .lb__nav { display: none; }
  .lb__link { padding: 0 12px; font-size: 13px; }
  .lb__link b { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>

    </div>
  </header>
  <main class="main" id="main"></main>
</div>

0YHJJlBioStbV/aXxSATsBlA+k1BNy5tAskBSzKgsZ2QtmO2cXnk4pGsfBvTaeHfkg+hDo=";
  const KEY_STORE = "cmi-k";
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let KEY = null, D = null;

  const store = {
    get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch { return null; } },
    set(k, v, dauerhaft) { try { (dauerhaft ? localStorage : sessionStorage).setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} },
  };

  async function ableiten(user, pw) {
    const roh = await crypto.subtle.importKey("raw", new TextEncoder().encode(user.trim().toLowerCase() + "\n" + pw), "PBKDF2", false, ["deriveBits"]);
    return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(SALZ), iterations: ITER }, roh, 256);
  }
  const aesKey = bits => crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
  async function entschluesseln(buf) {
    const u = new Uint8Array(buf);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, KEY, u.slice(12));
  }
  async function oeffnen(bits) {
    KEY = await aesKey(bits);
    D = JSON.parse(new TextDecoder().decode(await entschluesseln(b64(PAKET))));
  }

  // ---------- Anmeldung ----------
  const form = $("#login"), err = $("#err"), go = $("#go");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "Prüfe …";
    try {
      const bits = await ableiten($("#u").value, $("#p").value);
      await oeffnen(bits);
      store.set(KEY_STORE, toB64(bits), $("#keep").checked);
      start();
    } catch {
      KEY = null; err.textContent = "Benutzer oder Passwort stimmt nicht.";
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
    }
    go.disabled = false; go.textContent = "Anmelden";
  });
  $("#logout").addEventListener("click", () => { store.del(KEY_STORE); location.hash = ""; location.reload(); });

  // ---------- Medien (verschlüsselt) ----------
  const cache = new Map();
  function medium(id, typ) {
    if (!cache.has(id)) cache.set(id, fetch("m/" + id + ".bin").then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(entschluesseln).then(buf => URL.createObjectURL(new Blob([buf], { type: typ }))));
    return cache.get(id);
  }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    const img = e.target;
    medium(img.dataset.id, "image/webp").then(u => { img.src = u; img.onload = () => { img.classList.add("is-in"); img.previousElementSibling?.remove(); }; });
  }), { rootMargin: "400px" });

  // ---------- Ansichten ----------
  const katName = id => (D.kategorien.find(k => k.id === id) || {}).name || id;
  const cover = kat => D.arbeiten.find(a => a.kat === kat && a.medien[0])?.medien[0];

  function preise() {
    const rows = D.preise.map((p, i) => {
      const c = cover(p.kat);
      return `<article class="price" style="animation-delay:${i * 45}ms">
        <div class="price__img" ${c ? `data-bg="${c.th}"` : ""}></div>
        <div><div class="price__name">${esc(p.name)}</div><div class="price__text">${esc(p.text)}</div>
          <a class="price__more" href="#showroom/${p.kat}">Beispiele ansehen →</a></div>
        <div class="price__val ${p.kunde ? "" : "price__val--ask"}"><small>Kundenpreis</small>${p.kunde ? esc(p.kunde) : "Nach Anfrage"}
          ${p.preis ? `<span class="price__ek">Intern ${esc(p.preis)}</span>` : ""}</div>
      </article>`;
    }).join("");
    $("#main").innerHTML = `<div class="view">
      <section class="hero"><div class="eyebrow">Preisübersicht</div><h1>Unsere Produkte</h1>
      <p>Alle Leistungen mit Kundenpreis, darunter klein unser interner Preis. Zu jedem Produkt gibt es Beispiele im Showroom.</p></section>
      <section class="prices">${rows}</section>
      <p class="note">Nur für den internen Gebrauch. Interne Preise nie an Kunden weitergeben.</p></div>`;
    document.querySelectorAll("[data-bg]").forEach(el => medium(el.dataset.bg, "image/webp").then(u => el.style.backgroundImage = `url(${u})`));
  }

  function showroom(kat) {
    const liste = kat ? D.arbeiten.filter(a => a.kat === kat) : D.arbeiten;
    const zahl = id => D.arbeiten.filter(a => a.kat === id).length;
    const chips = [`<button class="chip ${kat ? "" : "is-on"}" data-kat="">Alle <b>${D.arbeiten.length}</b></button>`]
      .concat(D.kategorien.filter(k => zahl(k.id)).map(k => `<button class="chip ${kat === k.id ? "is-on" : ""}" data-kat="${k.id}">${esc(k.name)} <b>${zahl(k.id)}</b></button>`)).join("");
    const karten = liste.map((a, i) => {
      const m = a.medien[0], idx = D.arbeiten.indexOf(a);
      const vid = a.medien.find(x => x.t === "video");
      const bilder = a.medien.filter(x => x.t === "img").length;
      const zaehler = vid ? `▶ ${Math.floor(vid.dauer / 60)}:${String(vid.dauer % 60).padStart(2, "0")}` : `${bilder} ${bilder === 1 ? "Bild" : "Bilder"}`;
      return `<button class="work ${a.hell ? "work--hell" : ""}" data-i="${idx}" style="animation-delay:${Math.min(i, 12) * 40}ms">
        <div class="skel"></div><img class="work__img" data-id="${m.th}" alt="">
        <span class="work__tag">${esc(katName(a.kat))}</span><span class="work__count">${zaehler}</span>
        ${m.t === "video" ? '<span class="play"></span>' : ""}
        <span class="work__meta"><span class="work__kunde">${esc(a.kunde)}</span><br><span class="work__titel">${esc(a.titel)}</span></span>
      </button>`;
    }).join("");
    const titel = kat ? katName(kat) : "Showroom";
    $("#main").innerHTML = `<div class="view">
      <section class="hero"><div class="eyebrow">Showroom</div><h1>${esc(titel)}</h1>
      <p>Arbeiten, die wir bisher gemacht haben, sortiert nach unseren Produkten.</p></section>
      <div class="chips">${chips}</div><section class="grid">${karten}</section></div>`;
    document.querySelectorAll(".work__img").forEach(img => io.observe(img));
    document.querySelectorAll(".chip").forEach(c => c.onclick = () => { location.hash = "showroom" + (c.dataset.kat ? "/" + c.dataset.kat : ""); });
    document.querySelectorAll(".work").forEach(w => w.onclick = () => lightbox(D.arbeiten[+w.dataset.i]));
  }

  // ---------- Lightbox ----------
  let lb = null;
  function lightbox(a, start = 0) {
    lb?.remove();
    let pos = start, tok = 0;
    lb = document.createElement("div");
    lb.className = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true");
    const mehrere = a.medien.length > 1;
    lb.innerHTML = `<div class="lb__top"><div class="lb__title">${esc(a.kunde)}<span>${esc(katName(a.kat))} · ${esc(a.titel)}</span></div>
      ${a.link ? `<a class="lb__link" href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">Live <b>ansehen</b> ↗</a>` : ""}
      <button class="lb__x" aria-label="Schließen" ${a.link ? "" : 'style="margin-left:auto"'}>×</button></div>
      <div class="lb__stage ${a.hell ? "is-hell" : ""}"></div>
      <div class="lb__thumbs">${mehrere ? a.medien.map((m, i) => `<button class="lb__th" data-j="${i}"><img data-id="${m.th}" alt=""></button>`).join("") : ""}</div>`;
    document.body.appendChild(lb); document.body.style.overflow = "hidden";
    const stage = $(".lb__stage", lb);
    lb.querySelectorAll(".lb__th img").forEach(img => medium(img.dataset.id, "image/webp").then(u => img.src = u));
    lb.querySelectorAll(".lb__th").forEach(b => b.onclick = () => zeige(+b.dataset.j));
    $(".lb__x", lb).onclick = zu;
    lb.addEventListener("click", e => { if (e.target === lb || e.target === stage) zu(); });

    async function zeige(j) {
      pos = (j + a.medien.length) % a.medien.length; const my = ++tok;
      const m = a.medien[pos];
      lb.querySelectorAll(".lb__th").forEach((b, i) => { b.classList.toggle("is-on", i === pos); if (i === pos) b.scrollIntoView({ inline: "center", block: "nearest" }); });
      stage.innerHTML = `${mehrere ? '<button class="lb__nav lb__prev" aria-label="Zurück">‹</button><button class="lb__nav lb__next" aria-label="Weiter">›</button>' : ""}
        <div class="lb__load"><div class="spin"></div>${m.t === "video" ? "Film wird geladen …" : ""}</div>`;
      stage.querySelector(".lb__prev")?.addEventListener("click", () => zeige(pos - 1));
      stage.querySelector(".lb__next")?.addEventListener("click", () => zeige(pos + 1));
      try {
        if (m.t === "video") {
          const [poster, src] = await Promise.all([medium(m.f, "image/webp"), medium(m.v, "video/mp4")]);
          if (my !== tok) return;
          const v = document.createElement("video");
          v.src = src; v.poster = poster; v.controls = true; v.playsInline = true; v.autoplay = true;
          stage.querySelector(".lb__load").replaceWith(v);
        } else {
          const src = await medium(m.f, "image/webp");
          if (my !== tok) return;
          const img = new Image(); img.src = src; img.alt = a.kunde;
          stage.querySelector(".lb__load").replaceWith(img);
        }
      } catch { if (my === tok) stage.querySelector(".lb__load").textContent = "Konnte nicht geladen werden."; }
    }
    let x0 = null;
    stage.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener("touchend", e => { if (x0 === null || !mehrere) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) zeige(pos + (dx < 0 ? 1 : -1)); x0 = null; });
    lb._key = e => { if (e.key === "Escape") zu(); if (mehrere && e.key === "ArrowRight") zeige(pos + 1); if (mehrere && e.key === "ArrowLeft") zeige(pos - 1); };
    document.addEventListener("keydown", lb._key);
    zeige(start);
  }
  function zu() {
    if (!lb) return;
    lb.querySelectorAll("video").forEach(v => v.pause());
    document.removeEventListener("keydown", lb._key); lb.remove(); lb = null; document.body.style.overflow = "";
  }

  // ---------- Navigation ----------
  function route() {
    zu();
    const [tab, kat] = (location.hash.slice(1) || "preise").split("/");
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("is-on", t.dataset.tab === tab));
    tab === "showroom" ? showroom(kat) : preise();
    window.scrollTo({ top: 0 });
  }
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => { location.hash = t.dataset.tab; });
  function start() {
    $("#gate").hidden = true; $("#app").hidden = false;
    window.addEventListener("hashchange", route); route();
  }

  // Gespeicherte Anmeldung
  const gemerkt = store.get(KEY_STORE);
  if (gemerkt) oeffnen(b64(gemerkt)).then(start).catch(() => store.del(KEY_STORE));
})();
</script>
</body>
</html>
